services:
  solar-app:
    build: .
    container_name: solar-app
    env_file:
      - .env
    environment:
      STORAGE_PATH: /app/data/pv_values.json
      FETCH_INTERVAL_SECONDS: "10"
      ENABLE_BACKGROUND_FETCH: "true"
      PV_VERIFY_SSL: "false"
    ports:
      - "5000:5000"
    volumes:
      - solar-data:/app/data

volumes:
  solar-data:
